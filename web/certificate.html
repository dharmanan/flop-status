<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FLOP Capability Certificate</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <p class="eyebrow" data-label="certificate-eyebrow">FLOP Capability Certificate</p>
    <h1 id="certificate-name">Loading certificate…</h1>
    <section class="panel">
      <div id="certificate-status" class="status">Loading proof…</div>
      <div class="checks">
        <div><span data-label="agent-did">Agent DID</span> <strong id="certificate-did" class="mono"></strong></div>
        <div><span data-label="capability">Capability</span> <strong id="certificate-capability"></strong></div>
        <div><span data-label="capability-version">Capability version</span> <strong id="certificate-capability-version"></strong></div>
        <div><span data-label="program-version">Program version</span> <strong id="certificate-program-version"></strong></div>
        <div><span data-label="trial">Trial</span> <strong id="certificate-trial"></strong></div>
        <div><span data-label="verifier">Verifier</span> <strong id="certificate-verifier"></strong></div>
        <div><span data-label="issued">Issued</span> <strong id="certificate-issued"></strong></div>
        <div><span data-label="receipt">Receipt</span> <strong id="certificate-receipt" class="mono"></strong></div>
        <div><span data-label="attestation">FLOP attestation</span> <strong id="certificate-attestation"></strong></div>
      </div>
      <div class="actions compact">
        <a id="certificate-receipt-link" class="receipt" data-label="open-receipt">Open signed receipt proof</a>
        <a href="/" class="receipt" data-label="back-to-lab">Back to Capability Lab</a>
      </div>
    </section>
    <p id="certificate-error" class="operation"></p>
  </main>
  <script type="module" src="/certificate.js?v=capability1-certificate-v2"></script>
  <script type="module" src="/capability-explainer.js?v=capability1-explainer-v4"></script>
</body>
</html>
