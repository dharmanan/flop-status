<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Flop Proof Receipt Verification</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" type="image/png" sizes="64x64" href="/koray-mark.png">\n</head>
<body>
  <main>
    <div class="topbar">
      <p class="eyebrow" data-i18n="app_name">Flop Proof</p>
      <div class="language-switch" aria-label="Language">
        <button class="lang-button" data-lang="en" type="button">EN</button>
        <button class="lang-button" data-lang="tr" type="button">TR</button>
      </div>
    </div>
    <a class="back-link" href="/">
      <span class="lang-copy en-copy">← Back to Capability Lab</span>
      <span class="lang-copy tr-copy">← Capability Lab'e dön</span>
    </a>
    <h1 data-i18n="verify_title">Receipt verification</h1>
    <p class="status"><span data-i18n="receipt_signature">Receipt signature</span>: <strong id="signature-status" data-i18n="checking">CHECKING</strong></p>
    <dl id="receipt-fields"></dl>
    <p class="note" data-i18n="verify_note">This page independently verifies the server-signed receipt in this browser using the public Ed25519 key published by the Railway API.</p>
    <p id="verification-error" class="operation"></p>
  </main>
  <script type="module" src="/verify.js"></script>
</body>
</html>
