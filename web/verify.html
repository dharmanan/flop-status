<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Flop Proof Receipt Verification</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" type="image/png" sizes="64x64" href="/koray-mark.png">
</head>
<body>
  <main>
    <div class="topbar">
      <p class="eyebrow" data-i18n="app_name">Flop Proof</p>
      <div class="language-switch" aria-label="Language">
        <button class="lang-button" data-lang="en" type="button">EN</button>
        <button class="lang-button" data-lang="tr" type="button">TR</button>
      </div>
    </div>
    <a class="back-link" href="/">
      <span class="lang-copy en-copy">← Back to Capability Lab</span>
      <span class="lang-copy tr-copy">← Capability Lab'e dön</span>
    </a>
    <h1 data-i18n="verify_title">Receipt verification</h1>
    <p class="status"><span data-i18n="receipt_signature">Receipt signature</span>: <strong id="signature-status" data-i18n="checking">CHECKING</strong></p>
    <dl id="receipt-fields"></dl>
    <p class="note" data-i18n="verify_note">This page independently verifies the server-signed receipt in this browser using the public Ed25519 key published by the Railway API.</p>
    <p id="verification-error" class="operation"></p>
  </main>
  <footer class="designer-credit">
    <a class="footer-repo-link" href="https://github.com/dharmanan/flop-status" target="_blank" rel="noopener noreferrer" aria-label="Flop Proof repository on GitHub" title="Flop Proof on GitHub">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M12 .7a11.3 11.3 0 0 0-3.57 22.02c.56.1.77-.24.77-.54v-2.1c-3.12.68-3.78-1.33-3.78-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 1.72 2.63 1.22 3.27.93.1-.73.39-1.22.71-1.5-2.49-.28-5.1-1.24-5.1-5.55 0-1.23.44-2.23 1.16-3.01-.12-.28-.5-1.43.11-2.97 0 0 .94-.3 3.1 1.15A10.7 10.7 0 0 1 12 6.24c.96 0 1.92.13 2.82.38 2.15-1.46 3.1-1.15 3.1-1.15.61 1.54.23 2.69.11 2.97.72.78 1.16 1.78 1.16 3.01 0 4.32-2.62 5.26-5.12 5.54.4.35.76 1.03.76 2.08v3.1c0 .3.2.65.78.54A11.3 11.3 0 0 0 12 .7Z"/>
      </svg>
    </a>
    <span>Designed by</span>
    <a href="https://koraycifci.com" target="_blank" rel="noopener noreferrer" aria-label="Designed by Koray Çifci">
      <img src="/koray-mark.png" alt="Koray Çifci">
    </a>
  </footer>
  <script type="module" src="/verify.js"></script>
</body>
</html>
